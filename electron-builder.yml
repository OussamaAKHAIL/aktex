appId: com.aktext.app
productName: AKTeX
copyright: Copyright © 2026 AKTeX contributors

directories:
  output: release
  buildResources: assets

afterPack: scripts/after-pack.cjs

files:
  - dist/**/*
  - assets/icon.png
  - assets/icon.ico
  - package.json
  - node_modules/**/*
  - '!**/*.map'
  - '!**/*.md'
  - '!**/{test,tests,__tests__,example,examples}/**'

asar: true
npmRebuild: false
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
  # The app is unsigned in this repository. Skipping executable editing avoids
  # the winCodeSign archive (which contains macOS symlinks that cannot always
  # be extracted on Windows) and keeps the GitHub runner build reproducible.
  signAndEditExecutable: false

nsis:
  oneClick: false
  # A per-machine install avoids per-user AppData ACL/lock problems and gives
  # the installer the elevation needed to close an elevated AKTeX process.
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  include: assets/installer.nsh
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AKTeX
  deleteAppDataOnUninstall: false
