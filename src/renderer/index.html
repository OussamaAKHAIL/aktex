<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob: file:;" />
  <title>AKTeX</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #141414;
      --bg-panel: #1c1c1c;
      --bg-surface: #242424;
      --bg-active: #2e2e2e;
      --border: #2f2f2f;
      --border-subtle: #242424;
      --text-primary: #ede8dc;
      --text-muted: #7a7a7a;
      --text-dim: #4a4a4a;
      --accent: #c8742a;
      --accent-bright: #e08535;
      --log-error: #e05555;
      --log-warn: #d4a017;
      --log-ok: #5cad6e;
      --font-display: Georgia, serif;
      --font-ui: Inter, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font: 13px var(--font-ui);
      overflow: hidden;
      user-select: none;
    }

    button {
      font: inherit;
    }

    svg {
      width: 16px;
      height: 16px;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #titlebar {
      height: 34px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }

    .traffic-lights {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .traffic {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    .close {
      background: #e05555
    }

    .min {
      background: #d4a017
    }

    .max {
      background: #5cad6e
    }

    #wordmark {
      color: var(--text-primary);
      font: 700 15px var(--font-display);
      letter-spacing: -.02em;
      -webkit-app-region: no-drag;
    }

    #wordmark .x {
      color: var(--accent)
    }

    #active-path {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 11px;
      -webkit-app-region: no-drag;
    }

    #toolbar {
      height: 42px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .tb-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .tb-sep {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 8px
    }

    .tb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap
    }

    .tb-btn:hover,
    .icon-btn:hover {
      background: var(--bg-surface);
      color: var(--text-primary)
    }

    .tb-btn.compile {
      background: var(--accent);
      color: #fff;
      padding: 5px 14px;
      font-weight: 600
    }

    .tb-btn.compile:hover {
      background: var(--accent-bright);
      color: #fff
    }

    .tb-btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    #compiler-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 11px
    }

    .status-dot {
      height: 7px;
      width: 7px;
      border-radius: 50%;
      background: var(--log-warn);
      box-shadow: 0 0 6px var(--log-warn)
    }

    .status-dot.ready {
      background: var(--log-ok);
      box-shadow: 0 0 6px var(--log-ok)
    }

    .status-dot.error {
      background: var(--log-error);
      box-shadow: 0 0 6px var(--log-error)
    }

    #workspace {
      min-height: 0;
      flex: 1;
      display: flex;
      overflow: hidden
    }

    #filetree {
      width: 210px;
      min-width: 160px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      flex: none
    }

    .panel-header {
      height: 34px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase
    }

    .panel-header button {
      margin-left: auto;
      background: transparent;
      border: 0;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 17px;
      line-height: 1
    }

    .tree-scroll {
      overflow: auto;
      flex: 1;
      padding: 6px 0
    }

    .tree-empty {
      padding: 16px;
      color: var(--text-muted);
      font-size: 12px
    }

    .tree-item {
      height: 27px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding-right: 10px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap
    }

    .tree-item:hover {
      background: var(--bg-surface);
      color: var(--text-primary)
    }

    .tree-item.active {
      padding-left: calc(var(--indent) - 2px) !important;
      background: var(--bg-active);
      border-left: 2px solid var(--accent);
      color: var(--text-primary)
    }

    .tree-item.directory {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: default
    }

    .tree-item.directory:hover {
      background: transparent
    }

    .tree-icon {
      width: 14px;
      text-align: center;
      opacity: .7
    }

    #editor-pane {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-panel)
    }

    .tab-bar {
      height: 34px;
      flex: none;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding-left: 8px;
      overflow: auto;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border)
    }

    .tab {
      height: 33px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
      padding: 0 12px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap
    }

    .tab:hover {
      color: var(--text-primary)
    }

    .tab.active {
      background: var(--bg-panel);
      border-color: var(--border);
      color: var(--text-primary)
    }

    .tab .close-tab {
      opacity: .45;
      font-size: 15px
    }

    .tab .close-tab:hover {
      color: var(--log-error);
      opacity: 1
    }

    #editor {
      min-height: 0;
      flex: 1;
      overflow: hidden
    }

    .cm-editor {
      height: 100%;
      font-size: 12.5px
    }

    .cm-scroller {
      overflow: auto !important
    }

    #pdf-pane {
      width: 45%;
      min-width: 280px;
      flex: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
      border-left: 1px solid var(--border)
    }

    .pdf-toolbar {
      height: 34px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border)
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer
    }

    .pdf-page-info,
    .zoom {
      font-size: 11px;
      color: var(--text-muted)
    }

    .zoom {
      margin-left: auto
    }

    /* Continuous scroll PDF viewer */
    .pdf-scroll {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px;
      gap: 12px;
      background: #333
    }

    .pdf-empty {
      color: #999;
      text-align: center;
      line-height: 1.7;
      margin: auto
    }

    .pdf-empty strong {
      display: block;
      color: #ddd;
      font-weight: 500
    }

    .pdf-page-wrapper {
      flex: none;
      display: flex;
      justify-content: center
    }

    .pdf-page-canvas {
      display: block;
      max-width: 100%;
      height: auto;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
      background: #fff;
      cursor: crosshair
    }

    #log-panel {
      height: 130px;
      flex: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
      border-top: 1px solid var(--border)
    }

    .log-tabs {
      height: 28px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
      border-bottom: 1px solid var(--border-subtle)
    }

    .log-tab {
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text-dim);
      padding: 3px 10px;
      cursor: pointer;
      font-size: 11px
    }

    .log-tab:hover {
      background: var(--bg-surface);
      color: var(--text-muted)
    }

    .log-tab.active {
      background: var(--bg-surface);
      color: var(--text-primary)
    }

    .log-scroll {
      flex: 1;
      overflow: auto;
      padding: 6px 14px;
      font: 11px/18px var(--font-mono)
    }

    .log-line {
      display: flex;
      gap: 10px;
      white-space: pre-wrap;
      user-select: text
    }

    .timestamp {
      color: var(--text-dim);
      flex: none;
      user-select: text
    }

    .log-info {
      color: var(--text-muted);
      user-select: text
    }

    .log-warning {
      color: var(--log-warn);
      user-select: text
    }

    .log-error {
      color: var(--log-error);
      user-select: text
    }

    .log-success {
      color: var(--log-ok);
      user-select: text
    }

    .log-scroll {
      user-select: text
    }

    .cm-editor {
      user-select: text
    }

    #context-menu {
      position: fixed;
      display: none;
      z-index: 10;
      width: 144px;
      padding: 4px;
      background: #1e1e1e;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 8px 24px #0009
    }

    .context-action {
      width: 100%;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--text-primary);
      padding: 6px 8px;
      text-align: left;
      font-size: 12px;
      cursor: pointer
    }

    .context-action:hover {
      background: var(--bg-active)
    }

    .context-action.danger {
      color: var(--log-error)
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px
    }
  </style>
</head>

<body>
  <div id="app">
    <header id="titlebar">
      <div class="traffic-lights"><i class="traffic close"></i><i class="traffic min"></i><i class="traffic max"></i>
      </div>
      <div id="wordmark">Ak<i>Te</i><span class="x">X</span></div><span id="active-path">Untitled — AKTeX</span>
    </header>
    <nav id="toolbar">
      <div class="tb-group"><button class="tb-btn" id="btn-new" title="New file">＋ New</button><button class="tb-btn"
          id="btn-open-project" title="Open project">▱ Open</button><button class="tb-btn" id="btn-save"
          title="Save (Ctrl+S)">▣ Save</button></div><i class="tb-sep"></i>
      <div class="tb-group"><button class="tb-btn compile" id="btn-compile" title="Compile (Ctrl+Enter)">▶
          Compile</button><button class="tb-btn" id="btn-stop" title="Stop compilation" disabled>■</button></div><i
        class="tb-sep"></i>
      <div class="tb-group"><button class="tb-btn" id="btn-find" title="Find (Ctrl+F)">⌕ Find</button><button
          class="tb-btn" id="btn-export-zip" title="Export ZIP">⇩ Export</button><button class="tb-btn"
          id="btn-import-zip" title="Import ZIP">⇧ Import</button><button class="tb-btn" id="btn-compiler-help"
          title="Install MiKTeX">⚙</button></div>
      <div id="compiler-status"><i class="status-dot" id="status-dot"></i><span id="compiler-label">Checking
          compiler…</span></div>
    </nav>
    <main id="workspace">
      <aside id="filetree">
        <div class="panel-header">▱ Project <button id="btn-tree-new" title="New file">＋</button></div>
        <div class="tree-scroll" id="tree-content">
          <p class="tree-empty">Open a project to begin.</p>
        </div>
      </aside>
      <section id="editor-pane">
        <div class="tab-bar" id="tab-bar">
          <div class="tab active"><span>◇</span><span>Welcome</span></div>
        </div>
        <div id="editor"></div>
      </section>
      <section id="pdf-pane">
        <div class="pdf-toolbar">
          <button class="icon-btn" id="btn-zoom-out" title="Zoom out">−</button>
          <span class="zoom" id="zoom-level">100%</span>
          <button class="icon-btn" id="btn-zoom-in" title="Zoom in">＋</button>
          <span class="pdf-page-info" id="pdf-page-info" style="margin-left:8px"></span>
        </div>
        <div class="pdf-scroll" id="pdf-scroll">
          <div class="pdf-empty"><strong>PDF preview</strong>Compile a LaTeX document to see it here.</div>
        </div>
      </section>
    </main>
    <section id="log-panel">
      <div class="log-tabs"><button class="log-tab active" data-log="output">Output</button><button class="log-tab"
          data-log="problems">Problems <span id="problem-count"></span></button></div>
      <div class="log-scroll" id="log-scroll">
        <div class="log-line"><time class="timestamp">Ready</time><span class="log-info">Open a project to begin.</span>
        </div>
      </div>
    </section>
  </div>
  <div id="context-menu"><button class="context-action" data-action="new">New File</button><button
      class="context-action" data-action="rename">Rename</button><button class="context-action danger"
      data-action="delete">Delete</button></div>
  <script src="index.js"></script>
</body>

</html>
